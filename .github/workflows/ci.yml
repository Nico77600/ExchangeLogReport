name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.engine }})
    if: ${{ github.repository_owner == 'Nico77600' && github.repository == 'Nico77600/ExchangeLogReport' && github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: [{"engine":"PowerShell 7","shell":"pwsh"}]
    steps:
      - name: Check out the tested revision without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the exact pinned Pester and PSScriptAnalyzer modules
        shell: pwsh
        run: |
          & .\.github\scripts\Initialize-CIModules.ps1 -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-modules')

      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          & .\.github\scripts\Invoke-CI.ps1 -Stage Analyze -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ci-results')

      - name: Build and verify the standalone package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Build-Standalone.ps1 -OutputRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-package') -Unsigned
          $product = Get-Content .\product.json -Raw | ConvertFrom-Json
          $package = Join-Path $env:GITHUB_WORKSPACE ('artifacts\ci-package\{0}-{1}-win-x64' -f $product.name, $product.version)
          & (Join-Path $package 'src\Test-PackageIntegrity.ps1') -Root $package -DevelopmentMode

      - name: Run collector, Serve, package integrity and workflow tests under the packaged runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = Get-Content .\product.json -Raw | ConvertFrom-Json
          $package = Join-Path $env:GITHUB_WORKSPACE ('artifacts\ci-package\{0}-{1}-win-x64' -f $product.name, $product.version)
          & (Join-Path $package 'powershell\pwsh.exe') -NoLogo -NoProfile -File .\.github\scripts\Invoke-CITests.ps1 -PackageRoot $package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged-runtime regression tests failed.' }

      - name: Retain only synthetic validation summaries and file hashes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-validation
          path: |
            artifacts/ci-evidence/module-inventory.json
            artifacts/ci-evidence/validation-summary.json
          if-no-files-found: error
          retention-days: 7
