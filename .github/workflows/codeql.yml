{
  "name": "CodeQL (advisory)",
  "on": {
    "pull_request": {
      "branches": ["main"]
    },
    "push": {
      "branches": ["main"]
    },
    "schedule": [
      {
        "cron": "41 5 * * 3"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "codeql-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "analyze": {
      "name": "CodeQL ${{ matrix.language }} (advisory)",
      "if": "${{ contains(fromJSON('[\"Nico77600/ExchangeLogReport\",\"Nico77600/MailboxMessageReport\",\"Nico77600/MeetingCleanup\",\"Nico77600/MeetingCleanupOnPrem\",\"Nico77600/MessageTraceReport\",\"Nico77600/PurviewDlpReport\",\"Nico77600/PurviewDlpReport-Fabric\",\"Nico77600/RecipientLimitReport\"]'), github.repository) && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 25,
      "permissions": {
        "contents": "read",
        "security-events": "write"
      },
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": {
          "include": [
            {
              "language": "actions",
              "build-mode": "none",
              "runner": "ubuntu-latest",
              "config": {
                "name": "GitHub Actions workflows",
                "paths": [".github/workflows"]
              }
            },
            {
              "language": "javascript-typescript",
              "build-mode": "none",
              "runner": "ubuntu-latest",
              "config": {
                "name": "Report page and its script (portal and static reports)",
                "paths": ["package/templates"]
              }
            },
            {
              "language": "csharp",
              "build-mode": "manual",
              "runner": "windows-2022",
              "config": {
                "name": "Production C# with exact runtime references"
              }
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Check out event revision",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Run .NET security analyzers (informational)",
          "if": "${{ matrix.language == 'csharp' }}",
          "continue-on-error": true,
          "shell": "pwsh",
          "run": "& .\\.github\\scripts\\Invoke-NetAnalyzers.ps1"
        },
        {
          "name": "Initialize language-specific analysis",
          "uses": "github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066",
          "with": {
            "languages": "${{ matrix.language }}",
            "build-mode": "${{ matrix.build-mode }}",
            "threads": 2,
            "dependency-caching": "false",
            "config": "${{ toJson(matrix.config) }}"
          }
        },
        {
          "name": "Compile all production C# without runtime execution",
          "if": "${{ matrix.language == 'csharp' }}",
          "shell": "pwsh",
          "run": "& .\\.github\\scripts\\Build-CodeQLProduction.ps1"
        },
        {
          "name": "Analyze and upload advisory results",
          "uses": "github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066",
          "with": {
            "category": "/language:${{ matrix.language }}",
            "upload": "always",
            "upload-database": "false",
            "wait-for-processing": "true"
          }
        },
        {
          "name": "Preserve C# compilation inventory",
          "if": "${{ always() && matrix.language == 'csharp' }}",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "codeql-production-build",
            "path": ".github/codeql/out/build-manifest.json\n.github/codeql/out/compiled-sources.txt\n.github/codeql/out/compiler-references.txt\n.github/codeql/out/netanalyzers/netanalyzers.sarif\n.github/codeql/out/netanalyzers/netanalyzers-summary.txt\n.github/codeql/out/netanalyzers/netanalyzers-build.log",
            "if-no-files-found": "warn",
            "include-hidden-files": true,
            "retention-days": 14
          }
        }
      ]
    }
  }
}
